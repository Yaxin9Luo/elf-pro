# SigLIP2 + ELF multimodal instruction finetune on single-image LLaVA data.
# Use init_checkpoint to start from an ELF text checkpoint or warmup checkpoint.

data_modality: image_text
data_path: "data/llava_instruct.json"
eval_data_path: null
image_root: "data/images"
train_stage: mm_instruct

max_length: 512
max_prompt_length: 192
pad_token: "pad"

encoder_model_name: t5-small
latent_mean: 0.0
latent_std: 0.2

vision_encoder_model_name: "google/siglip2-base-patch16-224"
num_visual_tokens: 64
vision_projector_hidden_dim: null
freeze_vision_encoder: true
freeze_text_encoder: true

model: ELF-B
bottleneck_dim: 128
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4

init_checkpoint: null
init_checkpoint_use_ema: true
init_checkpoint_strict: false

denoiser_p_mean: -1.5
denoiser_p_std: 0.8
denoiser_noise_scale: 2.0
t_eps: 0.05
time_schedule: "logit_normal"

decoder_prob: 0.2
decoder_noise_scale: 5.0
decoder_p_mean: 0.8
decoder_p_std: 0.8

label_drop_prob: 0.1
self_cond_prob: 0.5

epochs: 1
global_batch_size: 128
blr: 0.00002
weight_decay: 0.0
warmup_epochs: 0.03
warmup_steps: -1
optimizer: adamw
adam_b1: 0.9
adam_b2: 0.95
vision_projector_lr_multiplier: 5.0

ema_decay1: 0.9999

sampling_configs_path: "src/configs/sampling_configs/cond_sampling_configs.yml"
num_samples: 64
online_eval: false

log_freq: 50
save_freq: 1
eval_freq: 1
max_checkpoints_to_keep: 3

output_dir: "outputs/elf_b-llava-siglip2-instruct"
hf_repo_id: null
resume: null

use_wandb: false
wandb_project: elf
wandb_entity: null
wandb_run_name: elf_b-llava-siglip2-instruct

seed: 42
num_workers: 4
