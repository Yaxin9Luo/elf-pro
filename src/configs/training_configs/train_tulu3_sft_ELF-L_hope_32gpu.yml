# ELF-L text-only SFT on filtered Tulu3-SFT, 4-node x 8-GPU HOPE run.
#
# Same global batch and LR as the 8-GPU config. More GPUs reduce wall time but
# intentionally do not change optimizer steps or the token budget.
# Two epochs see ~521.0M actual prompt+answer tokens and ~344.9M answer/loss tokens.

data_modality: text
train_stage: text
data_path: "/mnt/dolphinfs/ssd_pool/docker/user/hadoop-nlp-sh02/native_mm/mmdata/text_sft/tulu3_sft_mixture_t5_1024_filtered"
eval_data_path: null
max_length: 1024
max_input_length: null
pad_token: "pad"

encoder_model_name: "/mnt/dolphinfs/ssd_pool/docker/user/hadoop-nlp-sh02/3A/multimodal/luoyaxin03/projects/elf-pro/models/t5-small"
tokenizer_name: "/mnt/dolphinfs/ssd_pool/docker/user/hadoop-nlp-sh02/3A/multimodal/luoyaxin03/projects/elf-pro/models/t5-small"
latent_mean: 0.0
latent_std: 0.2

model: ELF-L
bottleneck_dim: 128
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4

