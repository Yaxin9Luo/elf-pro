# ELF-L overfit ablation on a clean-English Tulu3 short-answer 10k subset.
#
# Single-node 8 H800-141G HOPE run. The dataset has 10k single-turn examples,
# English-like prompts/answers, assistant targets <=16 T5 tokens before EOS,
# and no image/tool/code/refusal samples.
# With global_batch_size=256 and 80 epochs, this gives roughly 3120 optimizer
# steps while keeping per-GPU batch size at 32 for a safer 1024-token run.

data_modality: text
train_stage: text
